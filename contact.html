<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact The Band | Flying Yogurt</title>
  <meta name="description" content="Book Flying Yogurt for your next event, ask about a gig swap, or just say hello.">

  <link rel="icon" type="image/png" sizes="32x32" href="Assets/web/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="Assets/web/favicon-192.png">
  <link rel="apple-touch-icon" href="Assets/web/favicon-192.png">
  <meta name="theme-color" content="#0b0b0d">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Contact The Band | Flying Yogurt">
  <meta property="og:description" content="Book Flying Yogurt for your next event, ask about a gig swap, or just say hello.">
  <meta property="og:image" content="https://flyingyogurt.com/Assets/web/band-hero.jpg">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" id="site-header"></header>

  <main id="main">
    <section class="section section--tight">
      <div class="container">
        <div class="section-head">
          <span class="eyebrow">Let's Talk</span>
          <h1>Contact The Band</h1>
          <p>Hire us for a private party, bar or pub show, special event, or just to say you love the music.</p>
        </div>

        <div class="contact-card">
          <form action="https://formspree.io/f/xeoezyyy" method="POST" onsubmit="setTimeout(function(){ window.location = 'index.html'; }, 1000)">
            <input type="hidden" name="_next" value="https://flyingyogurt.com/index.html">

            <div class="field">
              <label for="contactName">Name</label>
              <input type="text" id="contactName" name="name" placeholder="Your name" required>
            </div>

            <div class="field">
              <label for="contactEmail">Email</label>
              <input type="email" id="contactEmail" name="email" placeholder="you@example.com" required>
            </div>

            <div class="field">
              <label for="contactSubject">Subject</label>
              <select id="contactSubject" name="subject" required>
                <option value="" disabled selected>Choose an option</option>
                <option value="Hire the Band">Hire the Band</option>
                <option value="Play a Gig">Play a Gig with the Band</option>
                <option value="General Inquiry">General Inquiry</option>
              </select>
            </div>

            <div class="field">
              <label for="contactMessage">Message</label>
              <textarea id="contactMessage" name="message" rows="4" placeholder="Tell us about your event or question" required></textarea>
            </div>

            <button class="btn btn--primary btn--block" type="submit">Send</button>
          </form>
        </div>

        <div class="contact-methods">
          <div class="contact-method"><span data-icon="pin"></span><span>Philadelphia and surrounding areas</span></div>
          <div class="contact-method"><span data-icon="mail"></span><a href="mailto:Music@FlyingYogurt.com">Music@FlyingYogurt.com</a></div>
          <div class="contact-method"><span data-icon="phone"></span><a href="tel:+12158134817">(215) 813-4817</a></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/main.js" defer></script>
</body>
</html>
